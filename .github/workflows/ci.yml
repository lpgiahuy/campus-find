name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: campusfind
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: campusfind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campusfind -d campusfind_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://campusfind:ci-test-password@localhost:5432/campusfind_test
      TEST_DATABASE_URL: postgresql+asyncpg://campusfind:ci-test-password@localhost:5432/campusfind_test
      JWT_SECRET_KEY: ci-only-jwt-secret-key-not-for-production
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v6
      - name: Cài đặt Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Cài thư viện
        run: python -m pip install -r requirements-dev.txt
      - name: Chạy kiểm thử
        run: python -m pytest
